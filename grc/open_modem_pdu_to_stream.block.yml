id: open_modem_pdu_to_stream
label: PDU to Stream (incremental)
category: '[open_modem]'

templates:
  imports: from gnuradio import open_modem
  make: open_modem.pdu_to_stream(${dtype.pyval})

parameters:
- id: dtype
  label: Type
  dtype: enum
  options: [float, complex]
  option_attributes:
    pyval: ["'float'", "'complex'"]
  default: float

inputs:
- label: pdus
  domain: message

outputs:
- label: out
  domain: stream
  dtype: ${ dtype }

file_format: 1
